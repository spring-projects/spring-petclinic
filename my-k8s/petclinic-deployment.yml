apiVersion: apps/v1
kind: Deployment

metadata:
  name: petclinic

spec:
  replicas: 2

  selector:
    matchLabels:
      app: petclinic

  template:
    metadata:
      labels:
        app: petclinic

    spec:
      containers:
        - name: petclinic
          image: sivakumar1207/petclinic:v1
          
          ports:
            - containerPort: 8080


          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: petclinic-config
                  key: SPRING_PROFILES_ACTIVE

            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef: 
                  name: petclinic-config
                  key: POSTGRES_URL

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD


