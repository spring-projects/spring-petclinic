apiVersion: apps/v1
kind: Deployment

metadata:
  name: petclinic
  namespace: petclinic

spec:
  replicas: 2

  selector:
    matchLabels:
      app: petclinic


  template:
    metadata:
      labels:
        app: petclinic

    spec:
      containers:
      - name: petclinic
        image: 18.61.219.242:8082/spring-petclinic:v1
        ports:
        - containerPort: 8080
