# Modelo. Copie para deploy/secret.yaml (ignorado pelo git) e troque a senha,
# ou crie direto: kubectl -n petclinic create secret generic petclinic-db \
#   --from-literal=POSTGRES_USER=petclinic --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 24)"
apiVersion: v1
kind: Secret
metadata:
  name: petclinic-db
  namespace: petclinic
type: Opaque
stringData:
  POSTGRES_USER: petclinic
  POSTGRES_PASSWORD: TROQUE-ME
