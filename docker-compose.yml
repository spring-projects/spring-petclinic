services:

  mysql:
    image: mysql:8.0.46@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    ports:
      # Loopback only: these credentials are committed, so the port must not be
      # reachable from the local network.
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: local-root-not-a-secret
      MYSQL_DATABASE: petclinic
      MYSQL_USER: petclinic
      MYSQL_PASSWORD: local-only-petclinic-password
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\" >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - /var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: spring-petclinic:local
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      MYSQL_URL: jdbc:mysql://mysql:3306/petclinic
      MYSQL_USER: petclinic
      MYSQL_PASS: local-only-petclinic-password
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 1500m
