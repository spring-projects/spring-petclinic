
services:

  postgres:
    image: postgres:18.4
    container_name: petclinic-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_DB: petclinic
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - petclinic-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic -d petclinic"]
      interval: 10s
      timeout: 5s
      retries: 5

  petclinic:
    image: petclinic:1.0
    container_name: petclinic-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      POSTGRES_URL: jdbc:postgresql://postgres:5432/petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASS: petclinic
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - petclinic-network

networks:
  petclinic-network:
    driver: bridge

volumes:
  postgres_data:
