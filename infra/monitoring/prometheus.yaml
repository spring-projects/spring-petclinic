global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: petclinic
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:19090"]
        labels:
          application: petclinic
          environment: diploma
