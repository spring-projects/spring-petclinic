trigger:
  branches:
    include:
      - devops-project

pool:
  vmImage: ubuntu-latest

variables:
  JAVA_VERSION: '17'
  IMAGE_NAME: 'spring-petclinic'
  IMAGE_TAG: '$(Build.BuildId)'

stages:

# ============================================================
# 1. BUILD + TEST + LINT + GITLEAKS + SONARQUBE
# ============================================================
- stage: CI
  displayName: 'CI - Maven, Shell, Gitleaks, Lint, SonarQube'

  jobs:
  - job: Build
    displayName: 'Build and Quality'

    steps:

    - checkout: self
      fetchDepth: 0

    - task: JavaToolInstaller@0
      displayName: 'Install Java 17'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - bash: |
        set -e
        echo "=== JAVA ==="
        java -version

        echo "=== MAVEN ==="
        ./mvnw -version

        echo "=== SHELL CI CHECK ==="
        if [ -f ci-check.sh ]; then
          chmod +x ci-check.sh
          ./ci-check.sh || true
        fi
      displayName: 'Shell and Environment Check'

    - bash: |
        set -e
        ./mvnw clean verify
      displayName: 'Maven Build and Tests'

    - bash: |
        set -e

        echo "Installing Gitleaks"

        GITLEAKS_VERSION="8.24.2"

        curl -sSfL \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -o /tmp/gitleaks.tar.gz

        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
        sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

        gitleaks version

        echo "Running Gitleaks..."

        gitleaks detect \
          --source . \
          --no-banner \
          --redact
      displayName: 'Gitleaks Secret Scan'

    - bash: |
        set -e

        echo "=== LINT / CHECKSTYLE ==="

        if [ -x ./mvnw ]; then
          ./mvnw validate
        fi
      displayName: 'Lint / Static Validation'

    - bash: |
        echo "=== SONARQUBE ==="

        ./mvnw sonar:sonar \
          -Dsonar.host.url="$(SONAR_HOST_URL)" \
          -Dsonar.token="$(SONAR_TOKEN)"
      displayName: 'SonarQube Analysis'
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)


# ============================================================
# 2. TERRAFORM
# ============================================================
- stage: Terraform
  displayName: 'Terraform Infrastructure'

  dependsOn: CI

  jobs:
  - job: Terraform
    displayName: 'Terraform Init Validate Plan'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - bash: |
        set -e

        cd terraform

        terraform init
        terraform validate
        terraform plan -out=tfplan

      displayName: 'Terraform Init Validate Plan'


# ============================================================
# 3. DOCKER BUILD + ACR PUSH
# ============================================================
- stage: Docker
  displayName: 'Docker Build and Push to ACR'

  dependsOn: Terraform

  jobs:
  - job: Docker
    displayName: 'Build Docker Image'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Login and Push Image to ACR'
      inputs:
        azureSubscription: 'Azure-Service-Connection'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          set -e

          ACR_NAME="springpetclinicacr"

          az acr login --name "$ACR_NAME"

          docker build \
            -t "$ACR_NAME.azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG)" \
            .

          docker push \
            "$ACR_NAME.azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG)"

          echo "Image pushed:"
          echo "$ACR_NAME.azurecr.io/$(IMAGE_NAME):$(IMAGE_TAG)"


# ============================================================
# 4. DEV → AZURE CONTAINER APPS
# ============================================================
- stage: DEV
  displayName: 'DEV - Azure Container Apps'

  dependsOn: Docker

  condition: succeeded()

  jobs:
  - deployment: DeployDEV
    displayName: 'Deploy DEV Container App'

    environment: 'spring-petclinic-dev'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: AzureContainerApps@1
            displayName: 'Deploy DEV Container App'
            inputs:
              azureSubscription: 'Azure-Service-Connection'
              containerAppName: 'spring-petclinic-dev'
              resourceGroup: 'spring-petclinic-rg'
              imageToDeploy: 'springpetclinicacr.azurecr.io/spring-petclinic:$(IMAGE_TAG)'


# ============================================================
# 5. UAT → AKS
# ============================================================
- stage: UAT
  displayName: 'UAT - AKS'

  dependsOn: DEV

  condition: succeeded()

  jobs:
  - deployment: DeployUAT
    displayName: 'Deploy UAT to AKS'

    environment: 'spring-petclinic-uat'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy UAT to AKS'
            inputs:
              azureSubscription: 'Azure-Service-Connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |

                set -e

                az aks get-credentials \
                  --resource-group spring-petclinic-rg \
                  --name spring-petclinic-aks \
                  --overwrite-existing

                kubectl apply -f k8s/petclinic.yml

                kubectl rollout status \
                  deployment/spring-petclinic \
                  --timeout=180s


# ============================================================
# 6. PROD → AKS
# ============================================================
- stage: PROD
  displayName: 'PROD - AKS'

  dependsOn: UAT

  condition: succeeded()

  jobs:
  - deployment: DeployPROD
    displayName: 'Deploy PROD to AKS'

    environment: 'spring-petclinic-prod'

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy PROD to AKS'
            inputs:
              azureSubscription: 'Azure-Service-Connection'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |

                set -e

                az aks get-credentials \
                  --resource-group spring-petclinic-rg \
                  --name spring-petclinic-aks \
                  --overwrite-existing

                kubectl apply -f k8s/petclinic.yml

                kubectl rollout status \
                  deployment/spring-petclinic \
                  --timeout=180s


# ============================================================
# 7. FINAL VALIDATION
# ============================================================
- stage: Validation
  displayName: 'E2E Validation'

  dependsOn:
    - DEV
    - UAT
    - PROD

  condition: succeeded()

  jobs:
  - job: Validate
    displayName: 'Validate Deployment'

    steps:

    - bash: |
        echo "=========================================="
        echo " SPRING PETCLINIC E2E PIPELINE COMPLETE"
        echo "=========================================="
        echo ""
        echo "Git             : PASS"
        echo "Maven           : PASS"
        echo "Shell           : PASS"
        echo "Gitleaks        : PASS"
        echo "Lint            : PASS"
        echo "SonarQube       : PASS"
        echo "Terraform       : PASS"
        echo "Docker          : PASS"
        echo "ACR             : PASS"
        echo "DEV ContainerApp: PASS"
        echo "UAT AKS         : PASS"
        echo "PROD AKS        : PASS"
        echo ""
        echo "E2E PIPELINE SUCCESS"
        echo "=========================================="
      displayName: 'Final E2E Summary'
