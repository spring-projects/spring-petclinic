trigger:
  branches:
    include:
      - devops-project

pool:
  vmImage: ubuntu-latest

variables:
  JAVA_VERSION: '17'
  IMAGE_NAME: 'spring-petclinic'
  IMAGE_TAG: '$(Build.BuildId)'

  # Actual Azure resources
  ACR_NAME: 'springpetclinicacr87345'
  AKS_RESOURCE_GROUP: 'Harsh'
  AKS_CLUSTER_NAME: 'k8-demo'

  # DEV Container App
  DEV_CONTAINER_APP: 'spring-petclinic-dev'
  DEV_RESOURCE_GROUP: 'spring-petclinic-devops-rg'

stages:

# ============================================================
# 1. CI - BUILD + TEST + GITLEAKS + LINT + SONARQUBE
# ============================================================

- stage: CI
  displayName: 'CI - Build, Test, Gitleaks, Lint, SonarQube'

  jobs:
  - job: Build
    displayName: 'Build and Quality'

    steps:

    - checkout: self
      fetchDepth: 0

    - task: JavaToolInstaller@0
      displayName: 'Install Java 17'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - bash: |
        set -e

        echo "=========================================="
        echo "JAVA VERSION"
        echo "=========================================="
        java -version

        echo "=========================================="
        echo "MAVEN VERSION"
        echo "=========================================="
        ./mvnw -version

        echo "=========================================="
        echo "SHELL CI CHECK"
        echo "=========================================="

        if [ -f ci-check.sh ]; then
          chmod +x ci-check.sh
          ./ci-check.sh || true
        else
          echo "ci-check.sh not found - continuing"
        fi
      displayName: 'Shell and Environment Check'

    - bash: |
        set -e

        echo "=========================================="
        echo "MAVEN CLEAN VERIFY"
        echo "=========================================="

        ./mvnw clean verify
      displayName: 'Maven Build and Tests'

    - bash: |
        set -e

        echo "=========================================="
        echo "GITLEAKS SECRET SCAN"
        echo "=========================================="

        GITLEAKS_VERSION="8.24.2"

        curl -sSfL \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -o /tmp/gitleaks.tar.gz

        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

        sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

        gitleaks version

        gitleaks detect \
          --source . \
          --no-banner \
          --redact
      displayName: 'Gitleaks Secret Scan'

    - bash: |
        set -e

        echo "=========================================="
        echo "LINT / STATIC VALIDATION"
        echo "=========================================="

        ./mvnw validate
      displayName: 'Lint / Static Validation'

    - bash: |
        set -e

        echo "=========================================="
        echo "SONARQUBE ANALYSIS"
        echo "=========================================="

        ./mvnw sonar:sonar \
          -Dsonar.host.url="$(SONAR_HOST_URL)" \
          -Dsonar.token="$(SONAR_TOKEN)"
      displayName: 'SonarQube Analysis'
      env:
        SONAR_TOKEN: $(SONAR_TOKEN)


# ============================================================
# 2. TERRAFORM
# ============================================================

- stage: Terraform
  displayName: 'Terraform Infrastructure'

  dependsOn: CI

  jobs:
  - job: Terraform
    displayName: 'Terraform Validate and Plan'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - bash: |
        set -e

        echo "=========================================="
        echo "TERRAFORM"
        echo "=========================================="

        cd terraform

        terraform init
        terraform validate
        terraform plan -out=tfplan
      displayName: 'Terraform Init Validate Plan'


# ============================================================
# 3. DOCKER BUILD + ACR PUSH
# ============================================================

- stage: Docker
  displayName: 'Docker Build and Push to ACR'

  dependsOn: Terraform

  condition: succeeded()

  jobs:
  - job: Docker
    displayName: 'Build Docker Image'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Build and Push Docker Image to ACR'
      inputs:
        azureSubscription: 'pet-clinic-connection'
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          set -e

          echo "=========================================="
          echo "AZURE / ACR"
          echo "=========================================="

          ACR_NAME="$(ACR_NAME)"
          IMAGE_NAME="$(IMAGE_NAME)"
          IMAGE_TAG="$(IMAGE_TAG)"

          echo "ACR       : $ACR_NAME"
          echo "Image     : $IMAGE_NAME"
          echo "Tag       : $IMAGE_TAG"

          echo "=========================================="
          echo "ACR LOGIN"
          echo "=========================================="

          az acr login --name "$ACR_NAME"

          echo "=========================================="
          echo "DOCKER BUILD"
          echo "=========================================="

          docker build \
            -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" \
            .

          echo "=========================================="
          echo "DOCKER PUSH"
          echo "=========================================="

          docker push \
            "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

          echo "=========================================="
          echo "IMAGE PUSHED"
          echo "=========================================="

          echo "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

          echo "=========================================="
          echo "ACR TAGS"
          echo "=========================================="

          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            -o table


# ============================================================
# 4. DEV - AZURE CONTAINER APPS
# ============================================================

- stage: DEV
  displayName: 'DEV - Azure Container Apps'

  dependsOn: Docker

  condition: succeeded()

  jobs:
  - deployment: DeployDEV
    displayName: 'Deploy DEV Container App'

    environment: 'spring-petclinic-dev'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy DEV Container App'
            inputs:
              azureSubscription: 'pet-clinic-connection'
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |

                set -e

                echo "=========================================="
                echo "DEV - AZURE CONTAINER APPS"
                echo "=========================================="

                ACR_NAME="$(ACR_NAME)"
                IMAGE_NAME="$(IMAGE_NAME)"
                IMAGE_TAG="$(IMAGE_TAG)"

                echo "Resource Group : $(DEV_RESOURCE_GROUP)"
                echo "Container App  : $(DEV_CONTAINER_APP)"
                echo "Image          : $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

                az containerapp update \
                  --name "$(DEV_CONTAINER_APP)" \
                  --resource-group "$(DEV_RESOURCE_GROUP)" \
                  --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

                echo "=========================================="
                echo "DEV DEPLOYMENT COMPLETE"
                echo "=========================================="

                az containerapp show \
                  --name "$(DEV_CONTAINER_APP)" \
                  --resource-group "$(DEV_RESOURCE_GROUP)" \
                  --query "properties.template.containers[0].image" \
                  -o tsv

                echo "=========================================="
                echo "DEV FQDN"
                echo "=========================================="

                az containerapp show \
                  --name "$(DEV_CONTAINER_APP)" \
                  --resource-group "$(DEV_RESOURCE_GROUP)" \
                  --query "properties.configuration.ingress.fqdn" \
                  -o tsv


# ============================================================
# 5. UAT - AKS
# ============================================================

- stage: UAT
  displayName: 'UAT - AKS'

  dependsOn: DEV

  condition: succeeded()

  jobs:
  - deployment: DeployUAT
    displayName: 'Deploy UAT to AKS'

    environment: 'spring-petclinic-uat'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy UAT to AKS'
            inputs:
              azureSubscription: 'pet-clinic-connection'
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |

                set -e

                echo "=========================================="
                echo "UAT - AKS"
                echo "=========================================="

                az aks get-credentials \
                  --resource-group "$(AKS_RESOURCE_GROUP)" \
                  --name "$(AKS_CLUSTER_NAME)" \
                  --overwrite-existing

                echo "=========================================="
                echo "AKS CLUSTER"
                echo "=========================================="

                kubectl get nodes

                echo "=========================================="
                echo "UAT NAMESPACE"
                echo "=========================================="

                kubectl get namespace petclinic-uat

                echo "=========================================="
                echo "APPLY UAT MANIFEST"
                echo "=========================================="

                kubectl apply \
                  -f k8s/petclinic-uat.yml

                echo "=========================================="
                echo "WAIT FOR UAT ROLLOUT"
                echo "=========================================="

                kubectl rollout status \
                  deployment/spring-petclinic \
                  -n petclinic-uat \
                  --timeout=180s

                echo "=========================================="
                echo "UAT PODS"
                echo "=========================================="

                kubectl get pods \
                  -n petclinic-uat \
                  -o wide

                echo "=========================================="
                echo "UAT SERVICE"
                echo "=========================================="

                kubectl get svc \
                  -n petclinic-uat

                echo "=========================================="
                echo "UAT ENDPOINTS"
                echo "=========================================="

                kubectl get endpoints \
                  spring-petclinic \
                  -n petclinic-uat


# ============================================================
# 6. PROD - AKS
# ============================================================

- stage: PROD
  displayName: 'PROD - AKS'

  dependsOn: UAT

  condition: succeeded()

  jobs:
  - deployment: DeployPROD
    displayName: 'Deploy PROD to AKS'

    environment: 'spring-petclinic-prod'

    strategy:
      runOnce:
        deploy:

          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy PROD to AKS'
            inputs:
              azureSubscription: 'pet-clinic-connection'
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |

                set -e

                echo "=========================================="
                echo "PROD - AKS"
                echo "=========================================="

                az aks get-credentials \
                  --resource-group "$(AKS_RESOURCE_GROUP)" \
                  --name "$(AKS_CLUSTER_NAME)" \
                  --overwrite-existing

                echo "=========================================="
                echo "AKS CLUSTER"
                echo "=========================================="

                kubectl get nodes

                echo "=========================================="
                echo "PROD NAMESPACE"
                echo "=========================================="

                kubectl get namespace petclinic-prod

                echo "=========================================="
                echo "APPLY PROD MANIFEST"
                echo "=========================================="

                kubectl apply \
                  -f k8s/petclinic-prod.yml

                echo "=========================================="
                echo "WAIT FOR PROD ROLLOUT"
                echo "=========================================="

                kubectl rollout status \
                  deployment/spring-petclinic \
                  -n petclinic-prod \
                  --timeout=180s

                echo "=========================================="
                echo "PROD PODS"
                echo "=========================================="

                kubectl get pods \
                  -n petclinic-prod \
                  -o wide

                echo "=========================================="
                echo "PROD SERVICE"
                echo "=========================================="

                kubectl get svc \
                  -n petclinic-prod

                echo "=========================================="
                echo "PROD ENDPOINTS"
                echo "=========================================="

                kubectl get endpoints \
                  spring-petclinic \
                  -n petclinic-prod


# ============================================================
# 7. FINAL VALIDATION
# ============================================================

- stage: Validation
  displayName: 'Final E2E Validation'

  dependsOn:
    - DEV
    - UAT
    - PROD

  condition: succeeded()

  jobs:
  - job: Validate
    displayName: 'Validate Complete Deployment'

    steps:

    - bash: |

        set -e

        echo ""
        echo "=============================================="
        echo "       SPRING PETCLINIC E2E PIPELINE"
        echo "=============================================="
        echo ""

        echo "Git              : PASS"
        echo "Maven            : PASS"
        echo "Tests            : PASS"
        echo "Gitleaks         : PASS"
        echo "Lint             : PASS"
        echo "SonarQube        : PASS"
        echo "Terraform        : PASS"
        echo "Docker           : PASS"
        echo "ACR              : PASS"
        echo "DEV ContainerApp : PASS"
        echo "UAT AKS          : PASS"
        echo "PROD AKS         : PASS"
        echo ""

        echo "=============================================="
        echo "       E2E PIPELINE SUCCESS"
        echo "=============================================="

      displayName: 'Final E2E Summary'
