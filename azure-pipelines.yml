trigger:
  branches:
    include:
      - devops-project

pool:
  vmImage: ubuntu-latest

variables:

  # ============================================================
  # SONARQUBE
  # ============================================================

  SONAR_HOST_IP: '135.235.220.22'
  SONAR_HOST_PORT: '9000'

  # ============================================================
  # APPLICATION
  # ============================================================

  IMAGE_NAME: 'spring-petclinic'
  IMAGE_TAG: '$(Build.BuildId)'

  # ============================================================
  # AZURE CONTAINER REGISTRY
  # ============================================================

  ACR_NAME: 'springpetclinicacr87345'

  # ============================================================
  # AKS
  # ============================================================

  AKS_RESOURCE_GROUP: 'Harsh'
  AKS_CLUSTER_NAME: 'k8-demo'

  # ============================================================
  # DEV CONTAINER APP
  # ============================================================

  DEV_CONTAINER_APP: 'spring-petclinic-dev'
  DEV_RESOURCE_GROUP: 'spring-petclinic-devops-rg'


stages:

# ============================================================
# 1. CI
# BUILD + TEST + GITLEAKS + LINT + SONARQUBE
# ============================================================

- stage: CI
  displayName: 'CI - Build, Test, Gitleaks, Lint, SonarQube'

  jobs:

  - job: Build
    displayName: 'Build and Quality'

    steps:

    - checkout: self
      fetchDepth: 0

    # ========================================================
    # JAVA
    # ========================================================

    - task: JavaToolInstaller@0
      displayName: 'Install Java 17'
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    # ========================================================
    # ENVIRONMENT CHECK
    # ========================================================

    - bash: |
        set -e

        echo "=========================================="
        echo "JAVA VERSION"
        echo "=========================================="

        java -version

        echo ""
        echo "=========================================="
        echo "MAVEN VERSION"
        echo "=========================================="

        ./mvnw -version

        echo ""
        echo "=========================================="
        echo "SHELL CI CHECK"
        echo "=========================================="

        if [ -f ci-check.sh ]; then
          chmod +x ci-check.sh
          ./ci-check.sh
        else
          echo "ci-check.sh not found - continuing"
        fi

      displayName: 'Shell and Environment Check'

    # ========================================================
    # MAVEN BUILD + TESTS
    # ========================================================

    - bash: |
        set -e

        echo "=========================================="
        echo "MAVEN CLEAN VERIFY"
        echo "=========================================="

        chmod +x mvnw

        ./mvnw clean verify

        echo ""
        echo "Maven build and tests completed successfully."

        echo ""
        echo "=========================================="
        echo "JACOCO REPORT"
        echo "=========================================="

        if [ -f target/site/jacoco/jacoco.xml ]; then
          ls -lh target/site/jacoco/jacoco.xml
        else
          echo "WARNING: JaCoCo XML report not found."
        fi

      displayName: 'Maven Build and Tests'

    # ========================================================
    # GITLEAKS
    # ========================================================

    - bash: |
        set -e

        echo "=========================================="
        echo "GITLEAKS SECRET SCAN"
        echo "=========================================="

        GITLEAKS_VERSION="8.24.2"

        curl -sSfL \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          -o /tmp/gitleaks.tar.gz

        tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks

        sudo mv /tmp/gitleaks /usr/local/bin/gitleaks

        gitleaks version

        echo ""
        echo "Git commit:"
        git rev-parse HEAD

        echo ""
        echo "Git branch:"
        git branch --show-current

        echo ""
        echo "Git commit count:"
        git rev-list --all --count

        echo ""
        echo "=========================================="
        echo "RUNNING GITLEAKS"
        echo "=========================================="

        if [ -f .gitleaks.toml ]; then

          gitleaks detect \
            --source . \
            --no-banner \
            --redact \
            --verbose \
            --config .gitleaks.toml \
            --report-format json \
            --report-path "$(Build.ArtifactStagingDirectory)/gitleaks-report.json"

        else

          gitleaks detect \
            --source . \
            --no-banner \
            --redact \
            --verbose \
            --report-format json \
            --report-path "$(Build.ArtifactStagingDirectory)/gitleaks-report.json"

        fi

        echo ""
        echo "=========================================="
        echo "GITLEAKS REPORT"
        echo "=========================================="

        if [ -f "$(Build.ArtifactStagingDirectory)/gitleaks-report.json" ]; then
          cat "$(Build.ArtifactStagingDirectory)/gitleaks-report.json"
        fi

      displayName: 'Gitleaks Secret Scan'

    # ========================================================
    # LINT / STATIC VALIDATION
    # ========================================================

    - bash: |
        set -e

        echo "=========================================="
        echo "LINT / STATIC VALIDATION"
        echo "=========================================="

        ./mvnw validate

        echo ""
        echo "Lint / static validation completed successfully."

      displayName: 'Lint / Static Validation'

    # ========================================================
    # SONARQUBE
    # ========================================================

    - bash: |
        set -e

        echo "=========================================="
        echo "SONARQUBE ANALYSIS"
        echo "=========================================="

        SONAR_HOST_URL="http://${SONAR_HOST_IP}:${SONAR_HOST_PORT}"

        echo "SonarQube URL: ${SONAR_HOST_URL}"

        if [ -z "$SONAR_TOKEN" ]; then
          echo "ERROR: SONAR_TOKEN is empty."
          exit 1
        fi

        echo "SonarQube token is configured."

        echo ""
        echo "Checking SonarQube server..."

        curl -fsS "${SONAR_HOST_URL}/api/system/status"

        echo ""
        echo "Starting SonarQube analysis..."

        ./mvnw \
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.1.0.4751:sonar \
          -Dsonar.host.url="${SONAR_HOST_URL}" \
          -Dsonar.token="$SONAR_TOKEN" \
          -Dsonar.coverage.jacoco.xmlReportPaths="target/site/jacoco/jacoco.xml"

        echo ""
        echo "=========================================="
        echo "SONARQUBE ANALYSIS SUCCESSFUL"
        echo "=========================================="

      displayName: 'SonarQube Analysis'

      env:
        SONAR_TOKEN: $(SONAR_TOKEN)


# ============================================================
# 2. TERRAFORM
# VALIDATE ONLY
#
# IMPORTANT:
# The current Terraform state exists on the VM.
# Azure DevOps hosted agents do not have that state.
#
# Therefore we intentionally DO NOT run terraform plan here.
# Remote backend can be added later.
# ============================================================

- stage: Terraform
  displayName: 'Terraform Validation'

  dependsOn: CI
  condition: succeeded()

  jobs:

  - job: Terraform
    displayName: 'Terraform Format and Validate'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '1.13.3'

    - task: AzureCLI@2
      displayName: 'Terraform Init Format Validate'
      inputs:
        azureSubscription: 'pet-clinic-connection'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          echo "=========================================="
          echo "TERRAFORM VALIDATION"
          echo "=========================================="

          cd terraform

          echo ""
          echo "Terraform version:"
          terraform version

          echo ""
          echo "Azure subscription:"
          export TF_VAR_subscription_id="$(az account show --query id -o tsv)"
          echo "Subscription ID obtained from Azure service connection."

          echo ""
          echo "Terraform initialization:"
          terraform init -input=false

          echo ""
          echo "Terraform formatting check:"
          terraform fmt -check -recursive

          echo ""
          echo "Terraform validation:"
          terraform validate

          echo ""
          echo "=========================================="
          echo "TERRAFORM VALIDATION SUCCESSFUL"
          echo "=========================================="

          echo ""
          echo "Terraform plan is intentionally skipped."
          echo "Remote backend can be configured later for full"
          echo "Terraform plan/apply from Azure DevOps."

# ============================================================
# 3. DOCKER BUILD + ACR PUSH
# ============================================================

- stage: Docker
  displayName: 'Docker Build and Push to ACR'

  dependsOn: Terraform
  condition: succeeded()

  jobs:

  - job: Docker
    displayName: 'Build Docker Image'

    steps:

    - checkout: self

    - task: AzureCLI@2
      displayName: 'Build and Push Docker Image to ACR'

      inputs:
        azureSubscription: 'pet-clinic-connection'
        scriptType: bash
        scriptLocation: inlineScript

        inlineScript: |

          set -e

          echo "=========================================="
          echo "AZURE / ACR"
          echo "=========================================="

          ACR_NAME="$(ACR_NAME)"
          IMAGE_NAME="$(IMAGE_NAME)"
          IMAGE_TAG="$(IMAGE_TAG)"

          echo "ACR       : $ACR_NAME"
          echo "Image     : $IMAGE_NAME"
          echo "Tag       : $IMAGE_TAG"

          echo ""
          echo "=========================================="
          echo "ACR LOGIN"
          echo "=========================================="

          az acr login --name "$ACR_NAME"

          echo ""
          echo "=========================================="
          echo "DOCKER BUILD"
          echo "=========================================="

          docker build \
            -t "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" \
            .

          echo ""
          echo "=========================================="
          echo "DOCKER PUSH"
          echo "=========================================="

          docker push \
            "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

          echo ""
          echo "=========================================="
          echo "IMAGE PUSHED"
          echo "=========================================="

          echo "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

          echo ""
          echo "=========================================="
          echo "ACR TAGS"
          echo "=========================================="

          az acr repository show-tags \
            --name "$ACR_NAME" \
            --repository "$IMAGE_NAME" \
            -o table


# ============================================================
# 4. DEV - AZURE CONTAINER APPS
# ============================================================

- stage: DEV
  displayName: 'DEV - Azure Container Apps'

  dependsOn: Docker
  condition: succeeded()

  jobs:

  - deployment: DeployDEV
    displayName: 'Deploy DEV Container App'

    environment: 'spring-petclinic-dev'

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy DEV Container App'

            inputs:
              azureSubscription: 'pet-clinic-connection'
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |

                set -e

                echo "=========================================="
                echo "DEV - AZURE CONTAINER APPS"
                echo "=========================================="

                ACR_NAME="$(ACR_NAME)"
                IMAGE_NAME="$(IMAGE_NAME)"
                IMAGE_TAG="$(IMAGE_TAG)"

                echo "Resource Group : $(DEV_RESOURCE_GROUP)"
                echo "Container App  : $(DEV_CONTAINER_APP)"
                echo "Image          : $ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

                echo ""
                echo "=========================================="
                echo "DEPLOY DEV IMAGE"
                echo "=========================================="

                az containerapp update \
                  --name "$(DEV_CONTAINER_APP)" \
                  --resource-group "$(DEV_RESOURCE_GROUP)" \
                  --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"

                echo ""
                echo "=========================================="
                echo "DEV DEPLOYMENT COMPLETE"
                echo "=========================================="

                az containerapp show \
                  --name "$(DEV_CONTAINER_APP)" \
                  --resource-group "$(DEV_RESOURCE_GROUP)" \
                  --query "properties.template.containers[0].image" \
                  -o tsv

                echo ""
                echo "=========================================="
                echo "DEV FQDN"
                echo "=========================================="

                az containerapp show \
                  --name "$(DEV_CONTAINER_APP)" \
                  --resource-group "$(DEV_RESOURCE_GROUP)" \
                  --query "properties.configuration.ingress.fqdn" \
                  -o tsv


# ============================================================
# 5. UAT - AKS
# ============================================================

- stage: UAT
  displayName: 'UAT - AKS'

  dependsOn: DEV
  condition: succeeded()

  jobs:

  - deployment: DeployUAT
    displayName: 'Deploy UAT to AKS'

    environment: 'spring-petclinic-uat'

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy UAT to AKS'

            inputs:
              azureSubscription: 'pet-clinic-connection'
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |

                set -e

                echo "=========================================="
                echo "UAT - AKS"
                echo "=========================================="

                ACR_NAME="$(ACR_NAME)"
                IMAGE_NAME="$(IMAGE_NAME)"
                IMAGE_TAG="$(IMAGE_TAG)"

                echo "ACR       : $ACR_NAME"
                echo "Image     : $IMAGE_NAME"
                echo "Tag       : $IMAGE_TAG"

                echo ""
                echo "=========================================="
                echo "GET AKS CREDENTIALS"
                echo "=========================================="

                az aks get-credentials \
                  --resource-group "$(AKS_RESOURCE_GROUP)" \
                  --name "$(AKS_CLUSTER_NAME)" \
                  --overwrite-existing

                echo ""
                echo "=========================================="
                echo "AKS CLUSTER"
                echo "=========================================="

                kubectl get nodes

                echo ""
                echo "=========================================="
                echo "UAT NAMESPACE"
                echo "=========================================="

                kubectl get namespace petclinic-uat

                echo ""
                echo "=========================================="
                echo "APPLY UAT MANIFEST"
                echo "=========================================="

                kubectl apply \
                  -f k8s/petclinic-uat.yml

                echo ""
                echo "=========================================="
                echo "SET UAT IMAGE"
                echo "=========================================="

                kubectl set image deployment/spring-petclinic \
                  spring-petclinic="$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" \
                  -n petclinic-uat

                echo ""
                echo "=========================================="
                echo "WAIT FOR UAT ROLLOUT"
                echo "=========================================="

                kubectl rollout status \
                  deployment/spring-petclinic \
                  -n petclinic-uat \
                  --timeout=180s

                echo ""
                echo "=========================================="
                echo "UAT PODS"
                echo "=========================================="

                kubectl get pods \
                  -n petclinic-uat \
                  -o wide

                echo ""
                echo "=========================================="
                echo "UAT SERVICE"
                echo "=========================================="

                kubectl get svc \
                  -n petclinic-uat

                echo ""
                echo "=========================================="
                echo "UAT IMAGE"
                echo "=========================================="

                kubectl get deployment spring-petclinic \
                  -n petclinic-uat \
                  -o jsonpath='{.spec.template.spec.containers[0].image}'

                echo ""


# ============================================================
# 6. PROD - AKS
# ============================================================

- stage: PROD
  displayName: 'PROD - AKS'

  dependsOn: UAT
  condition: succeeded()

  jobs:

  - deployment: DeployPROD
    displayName: 'Deploy PROD to AKS'

    environment: 'spring-petclinic-prod'

    strategy:

      runOnce:

        deploy:

          steps:

          - checkout: self

          - task: AzureCLI@2
            displayName: 'Deploy PROD to AKS'

            inputs:
              azureSubscription: 'pet-clinic-connection'
              scriptType: bash
              scriptLocation: inlineScript

              inlineScript: |

                set -e

                echo "=========================================="
                echo "PROD - AKS"
                echo "=========================================="

                ACR_NAME="$(ACR_NAME)"
                IMAGE_NAME="$(IMAGE_NAME)"
                IMAGE_TAG="$(IMAGE_TAG)"

                echo "ACR       : $ACR_NAME"
                echo "Image     : $IMAGE_NAME"
                echo "Tag       : $IMAGE_TAG"

                echo ""
                echo "=========================================="
                echo "GET AKS CREDENTIALS"
                echo "=========================================="

                az aks get-credentials \
                  --resource-group "$(AKS_RESOURCE_GROUP)" \
                  --name "$(AKS_CLUSTER_NAME)" \
                  --overwrite-existing

                echo ""
                echo "=========================================="
                echo "AKS CLUSTER"
                echo "=========================================="

                kubectl get nodes

                echo ""
                echo "=========================================="
                echo "PROD NAMESPACE"
                echo "=========================================="

                kubectl get namespace petclinic-prod

                echo ""
                echo "=========================================="
                echo "APPLY PROD MANIFEST"
                echo "=========================================="

                kubectl apply \
                  -f k8s/petclinic-prod.yml

                echo ""
                echo "=========================================="
                echo "SET PROD IMAGE"
                echo "=========================================="

                kubectl set image deployment/spring-petclinic \
                  spring-petclinic="$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG" \
                  -n petclinic-prod

                echo ""
                echo "=========================================="
                echo "WAIT FOR PROD ROLLOUT"
                echo "=========================================="

                kubectl rollout status \
                  deployment/spring-petclinic \
                  -n petclinic-prod \
                  --timeout=180s

                echo ""
                echo "=========================================="
                echo "PROD PODS"
                echo "=========================================="

                kubectl get pods \
                  -n petclinic-prod \
                  -o wide

                echo ""
                echo "=========================================="
                echo "PROD SERVICE"
                echo "=========================================="

                kubectl get svc \
                  -n petclinic-prod

                echo ""
                echo "=========================================="
                echo "PROD IMAGE"
                echo "=========================================="

                kubectl get deployment spring-petclinic \
                  -n petclinic-prod \
                  -o jsonpath='{.spec.template.spec.containers[0].image}'

                echo ""


# ============================================================
# 7. FINAL VALIDATION
# ============================================================

- stage: Validation
  displayName: 'Final E2E Validation'

  dependsOn:
    - DEV
    - UAT
    - PROD

  condition: succeeded()

  jobs:

  - job: Validate
    displayName: 'Validate Complete Deployment'

    steps:

    - bash: |

        set -e

        echo ""
        echo "=============================================="
        echo "       SPRING PETCLINIC E2E PIPELINE"
        echo "=============================================="
        echo ""

        echo "Git              : PASS"
        echo "Maven            : PASS"
        echo "Tests            : PASS"
        echo "Gitleaks         : PASS"
        echo "Lint             : PASS"
        echo "SonarQube        : PASS"
        echo "Terraform        : PASS"
        echo "Docker           : PASS"
        echo "ACR              : PASS"
        echo "DEV ContainerApp : PASS"
        echo "UAT AKS          : PASS"
        echo "PROD AKS         : PASS"
        echo ""

        echo "=============================================="
        echo "       E2E PIPELINE SUCCESS"
        echo "=============================================="

      displayName: 'Final E2E Summary'
