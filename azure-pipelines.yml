trigger:
  branches:
    include:
      - devops-project

pr:
  branches:
    include:
      - devops-project

pool:
  vmImage: 'ubuntu-latest'

variables:
  MAVEN_OPTS: '-Xmx2048m'
  imageName: 'spring-petclinic'

stages:

# ============================================================
# 1. BUILD + TEST
# ============================================================

- stage: Build
  displayName: 'Build and Test'

  jobs:
  - job: MavenBuild
    displayName: 'Maven Build and Test'

    steps:

    - checkout: self
      clean: true

    - task: JavaToolInstaller@0
      displayName: 'Set Java 21'
      inputs:
        versionSpec: '21'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - task: Maven@4
      displayName: 'Maven Clean Verify'
      inputs:
        mavenPomFile: 'pom.xml'
        goals: 'clean verify'
        options: '-Dmaven.test.failure.ignore=false'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        javaHomeOption: 'JDKVersion'
        jdkVersionOption: '1.21'
        mavenVersionOption: 'Default'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish Application Artifact'
      inputs:
        PathtoPublish: 'target'
        ArtifactName: 'spring-petclinic'
        publishLocation: 'Container'


# ============================================================
# 2. TERRAFORM VALIDATE
# ============================================================

- stage: TerraformValidate
  displayName: 'Terraform Validate'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Validate
    displayName: 'Validate Terraform'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - script: |
        set -e

        cd terraform

        echo "Initializing Terraform..."
        terraform init -backend=false

        echo "Validating Terraform..."
        terraform validate

        echo "Terraform validation completed successfully."
      displayName: 'Terraform Init and Validate'


# ============================================================
# 3. TERRAFORM PLAN
# ============================================================

- stage: TerraformPlan
  displayName: 'Terraform Plan'

  dependsOn: TerraformValidate
  condition: succeeded()

  jobs:
  - job: Plan
    displayName: 'Create Terraform Plan'

    steps:

    - checkout: self

    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: 'latest'

    - script: |
        set -e

        cd terraform

        echo "Initializing Terraform..."
        terraform init -backend=false

        echo "Creating Terraform plan..."
        terraform plan -out=tfplan

        echo "Terraform plan created successfully."
      displayName: 'Terraform Plan'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: 'terraform/tfplan'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'


# ============================================================
# 4. DOCKER BUILD
# ============================================================

- stage: DockerBuild
  displayName: 'Docker Build'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: Docker
    displayName: 'Build Docker Image'

    steps:

    - checkout: self
      clean: true

    - script: |
        set -e

        echo "Building Docker image..."

        docker build \
          -t $(imageName):$(Build.BuildId) \
          -t $(imageName):latest \
          .

        echo "Docker image built successfully."

        docker images $(imageName)

      displayName: 'Docker Build'


# ============================================================
# 5. PACKAGE PIPELINE INFORMATION
# ============================================================

- stage: Publish
  displayName: 'Publish Build Information'

  dependsOn:
    - Build
    - TerraformPlan
    - DockerBuild

  condition: succeeded()

  jobs:
  - job: Publish
    displayName: 'Publish Artifacts'

    steps:

    - checkout: self

    - script: |
        echo "=========================================="
        echo "Spring PetClinic CI/CD Pipeline"
        echo "=========================================="
        echo "Build ID: $(Build.BuildId)"
        echo "Branch: $(Build.SourceBranch)"
        echo "Commit: $(Build.SourceVersion)"
        echo "=========================================="
        echo "Maven Build       : SUCCESS"
        echo "Tests             : SUCCESS"
        echo "Terraform Validate: SUCCESS"
        echo "Terraform Plan    : SUCCESS"
        echo "Docker Build      : SUCCESS"
        echo "=========================================="
      displayName: 'Pipeline Summary'
