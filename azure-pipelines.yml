trigger:
  branches:
    include:
      - devops-project

pool:
  vmImage: ubuntu-latest

variables:
  IMAGE_NAME: 'springpetclinic'
  ACR_NAME: 'springpetclinicacr87345'
  ACR_LOGIN_SERVER: 'springpetclinicacr87345.azurecr.io'
  DEV_RG: 'spring-petclinic-devops-rg'
  ACA_APP: 'spring-petclinic-dev'

stages:

- stage: Security
  displayName: 'Security + Lint'
  jobs:

  - job: Gitleaks
    steps:
    - checkout: self
      fetchDepth: 0

    - bash: |
        set -e
        curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh \
          | sh -s -- -b $(Agent.TempDirectory)

        $(Agent.TempDirectory)/gitleaks detect \
          --source . \
          --no-banner \
          --redact

        echo "Gitleaks PASSED"
      displayName: 'Gitleaks Secret Scan'

  - job: Lint
    steps:
    - checkout: self

    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - bash: |
        set -e
        chmod +x mvnw
        ./mvnw validate
      displayName: 'Maven Validate'


- stage: Build
  displayName: 'Build + Test'
  dependsOn: Security
  condition: succeeded()

  jobs:

  - job: MavenBuild
    steps:
    - checkout: self

    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - bash: |
        set -e
        chmod +x mvnw
        ./mvnw clean verify
      displayName: 'Maven Build + Test'

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'JUnit'
        testResultsFiles: '**/surefire-reports/TEST-*.xml'
        failTaskOnFailedTests: true


- stage: SonarQube
  displayName: 'SonarQube'
  dependsOn: Build
  condition: succeeded()

  jobs:

  - job: Sonar
    steps:
    - checkout: self

    - task: JavaToolInstaller@0
      inputs:
        versionSpec: '17'
        jdkArchitectureOption: 'x64'
        jdkSourceOption: 'PreInstalled'

    - bash: |
        set -e
        chmod +x mvnw

        ./mvnw verify sonar:sonar \
          -Dsonar.projectKey=spring-petclinic \
          -Dsonar.host.url="$(SONAR_HOST_URL)" \
          -Dsonar.token="$(SONAR_TOKEN)"
      displayName: 'SonarQube Analysis'


- stage: Terraform
  displayName: 'Terraform Validate'
  dependsOn: SonarQube
  condition: succeeded()

  jobs:

  - job: TerraformValidate
    steps:
    - checkout: self

    - bash: |
        set -e
        terraform -chdir=terraform init -backend=false
        terraform -chdir=terraform validate
        terraform -chdir=terraform plan -lock=false
      displayName: 'Terraform Validate + Plan'


- stage: Docker
  displayName: 'Docker Build + Push to ACR'
  dependsOn: Terraform
  condition: succeeded()

  jobs:

  - job: DockerBuildPush
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Build and Push Docker Image'
      inputs:
        azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          az acr login --name "$(ACR_NAME)"

          IMAGE="$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.BuildId)"

          echo "Building $IMAGE"

          docker build -t "$IMAGE" .

          docker push "$IMAGE"

          echo "IMAGE=$IMAGE"


- stage: DEV
  displayName: 'Deploy DEV - Azure Container Apps'
  dependsOn: Docker
  condition: succeeded()

  jobs:

  - deployment: DeployDEV
    displayName: 'Deploy Spring PetClinic DEV'
    environment: 'dev'

    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureCLI@2
            displayName: 'Deploy to Azure Container Apps'
            inputs:
              azureSubscription: '$(AZURE_SERVICE_CONNECTION)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e

                IMAGE="$(ACR_LOGIN_SERVER)/$(IMAGE_NAME):$(Build.BuildId)"

                echo "Deploying:"
                echo "$IMAGE"

                az containerapp update \
                  --name "$(ACA_APP)" \
                  --resource-group "$(DEV_RG)" \
                  --image "$IMAGE"

                echo "DEV deployment completed"

                FQDN=$(az containerapp show \
                  --name "$(ACA_APP)" \
                  --resource-group "$(DEV_RG)" \
                  --query "properties.configuration.ingress.fqdn" \
                  -o tsv)

                echo "Application URL:"
                echo "https://$FQDN"
