
name: Spring PetClinic CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build and Test with Java 17

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Prepare PostgreSQL test credentials
        run: |
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          printf 'POSTGRES_PASSWORD=%s\n' "$PASSWORD" > .env

      - name: Run Maven Build and Tests
        run: ./mvnw -B clean test

      - name: Package Application
        run: ./mvnw -B package -DskipTests

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: spring-petclinic-artifact
          path: target/*.jar
          retention-days: 7
