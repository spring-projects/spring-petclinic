name: AI Code Review
 
on:
  pull_request:
    types: [opened, synchronize, reopened]
 
permissions:
  contents: read
  pull-requests: write
 
jobs:
  ai-review:
    uses: 7391997393/ai-review-agentt/.github/workflows/reusable-ai-review.yml@features/resolve-review-threads
    with:
      cg_model: ${{ vars.CG_MODEL }}
      cg_base_url: ${{ vars.CG_BASE_URL }}
    secrets:
      cg_api_key: ${{ secrets.CG_API_KEY }}
      gh_pat: ${{ secrets.GH_PAT }}
 
