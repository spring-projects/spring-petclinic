name: "SBOM & AI BOM Generation Pipeline"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - main
  schedule:
    # Weekly audit run (Mondays at 05:00 UTC)
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # 1. Dual Software SBOM Generation (Gradle Native + Anchore Syft)
  # --------------------------------------------------------------------------
  generate-software-sboms:
    name: "Generate Software SBOMs (Gradle + Syft)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Pin to v7.0.2 (Immutable SHA)
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # Pin to v6.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Approach 1: Build-Native Gradle CycloneDX Plugin (from build.gradle)
      - name: Generate Gradle Native CycloneDX SBOM
        run: |
          chmod +x gradlew
          ./gradlew cyclonedxDirectBom -x test
          mkdir -p sbom-artifacts
          if [ -f "build/reports/bom.json" ]; then
            cp build/reports/bom.json sbom-artifacts/sbom.gradle-native.cyclonedx.json
          fi

      # Approach 2: Universal CLI Scanner (Anchore Syft)
      - name: Generate Syft CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # Pin to v0.24.3
        with:
          path: "./"
          format: "cyclonedx-json"
          output-file: "sbom-artifacts/sbom.syft.cyclonedx.json"

      - name: Upload Software SBOM Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # Pin to v7.0.2
        with:
          name: software-bill-of-materials
          path: sbom-artifacts/*.json
          retention-days: 30

  # --------------------------------------------------------------------------
  # 2. AI BOM Extraction & Packaging (Model Card + Checkpoint Hashes)
  # --------------------------------------------------------------------------
  generate-ai-bom:
    name: "Generate AI BOM (CycloneDX 1.6 ML)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Pin to v7.0.1 (Immutable SHA)
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # Pin to v5.4.0
        with:
          python-version: "3.11"

      - name: Extract Model Checksum and Generate AI BOM Manifest
        run: |
          mkdir -p aibom-artifacts

          # Inspect model file or use fallback mock digest
          MODEL_PATH="models/classifier.onnx"
          if [ -f "$MODEL_PATH" ]; then
            MODEL_SHA256=$(sha256sum "$MODEL_PATH" | awk '{print $1}')
          else
            MODEL_SHA256="simulated-8f4b23b10b01ce4598a28723c914bf6"
          fi

          # Output CycloneDX 1.6 ML-BOM manifest
          cat <<EOF > aibom-artifacts/aibom.cyclonedx.json
          {
            "\$schema": "http://cyclonedx.org/schema/bom-1.6.schema.json",
            "bomFormat": "CycloneDX",
            "specVersion": "1.6",
            "serialNumber": "urn:uuid:$(uuidgen)",
            "version": 1,
            "components": [
              {
                "type": "machine-learning-model",
                "name": "pet-breed-classifier",
                "version": "1.0.0",
                "hashes": [
                  {
                    "alg": "SHA-256",
                    "content": "${MODEL_SHA256}"
                  }
                ],
                "modelCard": {
                  "modelParameters": {
                    "approach": {
                      "type": "supervised"
                    },
                    "task": "image-classification",
                    "architectureFamily": "Vision-Transformer",
                    "modelArchitecture": "ViT-B/16-ONNX"
                  },
                  "considerations": {
                    "users": ["Clinic Intake Staff"],
                    "useCases": ["Auto-suggesting pet breed categories during intake"],
                    "limitations": ["Not intended for clinical medical diagnosis"]
                  }
                }
              }
            ]
          }
          EOF
          echo "AI BOM generated successfully."

      - name: Upload AI BOM Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # Pin to v7.0.2
        with:
          name: ai-bill-of-materials
          path: aibom-artifacts/aibom.cyclonedx.json
          retention-days: 30

  # --------------------------------------------------------------------------
  # 3. AI BOM Generation using 0disoft CycloneDX ML BOM Generator (Optional)
  # --------------------------------------------------------------------------
  ai-bom:
    name: "Generate AI BOM (0disoft CycloneDX ML)"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Pin to v7.0.2 (Immutable SHA)
        with:
          fetch-depth: 1

      - name: "0disoft AI BOM"
        uses: 0disoft/ai-bom-generator@d2748ee82a1c72ada257e5d583b337fd53db87fc # Pin to v0.8.2 (Immutable SHA)
        with:
          model-directory: .
          warnings: allow

      - name: "Verify AI-BOM outputs"
        shell: bash
        run: |
          set -euo pipefail
          test -s "${{ steps.ai-bom.outputs.bom-path }}"
          test -s "${{ steps.ai-bom.outputs.warning-report-path }}"
          test -s "${{ steps.ai-bom.outputs.summary-path }}"
          test "${{ steps.ai-bom.outputs.status }}" = "success"