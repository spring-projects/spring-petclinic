# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/use-cases-and-examples/building-and-testing/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17' ]

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{matrix.java}}
        uses: actions/setup-java@v4
        with:
          java-version: ${{matrix.java}}
          distribution: 'adopt'
          cache: maven
      - name: Build with Maven Wrapper
        run: ./mvnw -B verify

      - name: Simulate build failure for RCA demo
        run: |
          echo "Simulating a CI build failure"
          exit 1
    
  analyze:
    needs: build
    if: ${{ needs.build.result == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: RCA placeholder
        run: echo "Build failed - RCA analysis would start here"

