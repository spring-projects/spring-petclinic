name: Docker Image CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t spring-petclinic:ci .

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: spring-petclinic:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          format: json
          output: trivy-report.json
          exit-code: '0'
          timeout: 15m
          version: v0.76.2
      - name: Upload Trivy Security Report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-security-report
          path: trivy-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Generate Security Summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from collections import Counter

          with open("trivy-report.json") as f:
              report = json.load(f)

          counts = Counter(
              vuln["Severity"]
              for result in report.get("Results", [])
              for vuln in result.get("Vulnerabilities", [])
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Container Security Summary\n\n")
              f.write("| Severity | Findings |\n")
              f.write("|---|---:|\n")
              f.write(f"| CRITICAL | {counts['CRITICAL']} |\n")
              f.write(f"| HIGH | {counts['HIGH']} |\n")
              f.write("\n**Policy:** Report Only\n")
          PY
      - name: Push Docker Image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHA_TAG="sha-${GITHUB_SHA::12}"

          docker tag spring-petclinic:ci "$IMAGE:$SHA_TAG"
          docker tag spring-petclinic:ci "$IMAGE:latest"

          docker push "$IMAGE:$SHA_TAG"
          docker push "$IMAGE:latest"
